    FootballPredictionCreate:
      properties:
        prediction_id:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{7,63}$
          - type: 'null'
          title: Prediction Id
          description: Identificador lógico y estable de la selección. Si se omite, el servidor genera
            uno. Enviarlo de nuevo crea una versión nueva.
          examples:
          - 3d0f6f3e5c1a4f0ab1c2d3e4f5a6b7c8
        idempotency_key:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$
          title: Idempotency Key
          description: Clave única global en football_predictions (no por analista ni por lote). Un reintento
            con la misma clave y el mismo cuerpo devuelve la versión existente; con un cuerpo distinto
            se rechaza como conflicto.
          examples:
          - 2026-10-24-liga-mx-123456-1x2-home
        event_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Event Id
          description: Identificador del partido en la fuente (ESPN).
          examples:
          - 736644
        match_date:
          type: string
          format: date
          title: Match Date
          description: Fecha del partido en horario de Ciudad de México (UTC-6). Es el campo que filtra
            la jornada.
          examples:
          - '2026-10-24'
        league:
          $ref: '#/components/schemas/FootballLeague'
          description: Competición. Consulta el catálogo en /predictions/markets.
          examples:
          - liga_mx
        home_team:
          type: string
          maxLength: 120
          minLength: 1
          title: Home Team
          description: Equipo local tal como lo reporta la fuente.
          examples:
          - Pumas UNAM
        away_team:
          type: string
          maxLength: 120
          minLength: 1
          title: Away Team
          description: Equipo visitante tal como lo reporta la fuente.
          examples:
          - Necaxa
        kickoff:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Kickoff
          description: Inicio del partido con offset. El servidor intenta verificarlo contra la fuente.
            Si no lo logra, conserva este valor como referencia, pero timing queda unverified.
          examples:
          - '2026-10-24T20:00:00-06:00'
        market:
          $ref: '#/components/schemas/Market'
          description: Mercado de la selección.
          examples:
          - 1x2
        period:
          $ref: '#/components/schemas/Period'
          description: Periodo evaluado. full_time = regulación, sin alargue ni penales. second_half no
            acumula el primer tiempo. Las estadísticas se liquidan por mitad solo si la fuente proporciona
            ese periodo.
          default: full_time
          examples:
          - full_time
        selection:
          anyOf:
          - type: string
          - type: 'null'
          title: Selection
          description: 'Selección del mercado. 1x2: home/draw/away. Doble oportunidad: home_or_draw, home_or_away
            o draw_or_away. Hándicaps y más córners: home/away o home/draw/away. Over/under: over/under.
            BTTS: yes/no. Primer gol: home/away/none. Marcador exacto no usa este campo.'
          examples:
          - home
        line:
          anyOf:
          - type: number
          - type: 'null'
          title: Line
          description: Línea del mercado. asian_handicap admite incrementos de 0.25; los demás mercados
            usan incrementos de 0.5. Para asian_handicap la línea se aplica al lado seleccionado; en european_handicap
            se aplica siempre al local. Over/under requiere línea positiva.
          examples:
          - -1.5
        team:
          anyOf:
          - type: string
            enum:
            - home
            - away
          - type: 'null'
          title: Team
          description: Equipo para mercados por equipo (goles, córners, tarjetas, remates).
          examples:
          - home
        player:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 2
          - type: 'null'
          title: Player
          description: Nombre del jugador para mercados de jugador.
          examples:
          - Guillermo Martínez
        player_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Player Id
          description: Id del jugador en la fuente. Mejora la identificación.
          examples:
          - '329917'
        home_goals:
          anyOf:
          - type: integer
            maximum: 20.0
            minimum: 0.0
          - type: 'null'
          title: Home Goals
          description: Goles del local para marcador exacto.
          examples:
          - 2
        away_goals:
          anyOf:
          - type: integer
            maximum: 20.0
            minimum: 0.0
          - type: 'null'
          title: Away Goals
          description: Goles del visitante para marcador exacto.
          examples:
          - 1
        probability:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Probability
          description: Probabilidad declarada por el analista (0-100).
          examples:
          - 58.0
        confidence:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Confidence
          description: Confianza en estrellas (1-5).
          examples:
          - 4
        rationale:
          type: string
          maxLength: 4000
          minLength: 5
          title: Rationale
          description: Justificación de la selección.
          examples:
          - Local con mejor forma y ventaja de localía.
        sources:
          items:
            $ref: '#/components/schemas/PredictionSource'
          type: array
          maxItems: 20
          minItems: 1
          title: Sources
          description: Fuentes consultadas. Se exige al menos una.
        analyst:
          type: string
          maxLength: 80
          minLength: 2
          title: Analyst
          description: Identificador del analista que emite la selección.
          examples:
          - ana.garcia
        method_version:
          type: string
          maxLength: 40
          minLength: 1
          title: Method Version
          description: Versión del método o modelo usado por el analista.
          examples:
          - analista-v1
        generated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Generated At
          description: Hora en que el analista generó la selección, con offset. Se conserva aparte y nunca
            sustituye a received_at.
          examples:
          - '2026-10-24T10:30:00-06:00'
        notes:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Notes
          description: Nota libre para el análisis posterior.
      additionalProperties: false
      type: object
      required:
      - idempotency_key
      - event_id
      - match_date
      - league
      - home_team
      - away_team
      - market
      - probability
      - confidence
      - rationale
      - sources
      - analyst
      - method_version
      title: FootballPredictionCreate
      description: 'Una selección atómica dentro de una carga por lotes.


        ``prediction_id`` es el identificador lógico y estable de la selección. Si

        se envía de nuevo con el mismo ``prediction_id``, la API crea una versión

        nueva (no sobrescribe). ``idempotency_key`` evita duplicados por reintentos.'
      examples:
      - analyst: ana.garcia
        away_team: Necaxa
        confidence: 4
        event_id: 736644
        generated_at: '2026-10-24T10:30:00-06:00'
        home_team: Pumas UNAM
        idempotency_key: 2026-10-24-liga-mx-123456-1x2-home
        kickoff: '2026-10-24T20:00:00-06:00'
        league: liga_mx
        market: 1x2
        match_date: '2026-10-24'
        method_version: analista-v1
        period: full_time
        prediction_id: 3d0f6f3e5c1a4f0ab1c2d3e4f5a6b7c8
        probability: 58.0
        rationale: Local con mejor forma y ventaja de localía.
        selection: home
        sources:
        - name: ESPN
          url: https://site.api.espn.com/apis/site/v2/sports/soccer/mex.1/summary?event=736644
    FootballPredictionDetailResponse:
