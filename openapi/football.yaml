openapi: 3.1.0
info:
  title: BET Analytics API - Fútbol
  description: Contrato OpenAPI de fútbol. Incluye solo las rutas `/api/v1/football` y los esquemas que
    esas rutas referencian. El resto de deportes está en archivos separados dentro de `openapi/`.
  version: 1.3.0
  contact:
    name: BET Analytics
  license:
    name: Privado
paths:
  /api/v1/football/results:
    get:
      tags:
      - Football
      summary: Stored Results
      operationId: stored_results_api_v1_football_results_get
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date
      - name: league
        in: query
        required: false
        schema:
          enum:
          - all
          - liga_mx
          - brasileirao
          - leagues_cup
          type: string
          default: all
          title: League
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Page Size
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          deprecated: true
          title: Limit
        deprecated: true
      - name: hour
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 23
            minimum: 0
          - type: 'null'
          title: Hour
      - name: market
        in: query
        required: false
        schema:
          type: string
          default: winner
          title: Market
      - name: min_probability
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 100
            minimum: 0
          - type: 'null'
          title: Min Probability
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoredFootballPrediction'
                title: Response Stored Results Api V1 Football Results Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/football/results/update:
    post:
      tags:
      - Football
      summary: Update Results
      operationId: update_results_api_v1_football_results_update_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FootballResultsUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FootballResultsUpdateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/football/predictions/markets:
    get:
      tags:
      - Football Predictions
      summary: Catálogo de ligas, mercados, periodos y reglas
      operationId: prediction_catalog_api_v1_football_predictions_markets_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FootballMarketCatalogResponse'
  /api/v1/football/predictions:
    post:
      tags:
      - Football Predictions
      summary: Registra un lote de selecciones
      description: Cada elemento del lote se guarda por separado. Errores de esquema o validación Pydantic
        invalidan el lote completo con 422; conflictos de negocio se devuelven en el elemento afectado.
        received_at siempre lo genera el servidor. Solo un inicio verificado permite declarar pre_match/late;
        el kickoff declarado sin verificación queda como referencia y timing=unverified. Reenviar la misma
        idempotency_key con el mismo cuerpo devuelve la versión existente; con otro cuerpo se rechaza
        ese elemento. Responder 201 si hubo creaciones; 200 si no hubo creaciones y existe al menos un
        reintento válido (puede incluir rechazos); 409 si todos los elementos fueron rechazados.
      operationId: register_predictions_api_v1_football_predictions_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FootballPredictionBatchRequest'
            examples:
              lote_liga_mx:
                value:
                  items:
                  - prediction_id: 3d0f6f3e5c1a4f0ab1c2d3e4f5a6b7c8
                    idempotency_key: 2026-10-24-liga-mx-736644-1x2-home
                    event_id: 736644
                    match_date: '2026-10-24'
                    league: liga_mx
                    home_team: Pumas UNAM
                    away_team: Necaxa
                    kickoff: '2026-10-24T20:00:00-06:00'
                    market: 1x2
                    period: full_time
                    selection: home
                    probability: 58.0
                    confidence: 4
                    rationale: Local con mejor forma y ventaja de localía.
                    sources:
                    - name: ESPN
                      url: https://site.api.espn.com/apis/site/v2/sports/soccer/mex.1/summary?event=736644
                    analyst: ana.garcia
                    method_version: analista-v1
                    generated_at: '2026-10-24T10:30:00-06:00'
                  - idempotency_key: 2026-10-24-liga-mx-736644-total-goals-over-2.5
                    event_id: 736644
                    match_date: '2026-10-24'
                    league: liga_mx
                    home_team: Pumas UNAM
                    away_team: Necaxa
                    market: total_goals
                    period: full_time
                    selection: over
                    line: 2.5
                    probability: 61.0
                    confidence: 3
                    rationale: Ambos equipos generan más de dos goles por partido.
                    sources:
                    - name: ESPN
                    analyst: ana.garcia
                    method_version: analista-v1
      responses:
        '201':
          description: Al menos una selección se registró como versión nueva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FootballPredictionBatchResponse'
              example:
                received_at: '2026-10-24T17:05:12.345678Z'
                total: 2
                created: 2
                replayed: 0
                rejected: 0
                items:
                - prediction_id: 3d0f6f3e5c1a4f0ab1c2d3e4f5a6b7c8
                  version: 1
                  version_id: 9a1c2e3f4b5d6a7c8e9f0a1b2c3d4e5f
                  idempotency_key: 2026-10-24-liga-mx-736644-1x2-home
                  status: created
                  analyst: ana.garcia
                  probability: 58.0
                  received_before_kickoff: true
                  record:
                    document_id: 671b2c3d4e5f60718293a4b5
                    prediction_id: 3d0f6f3e5c1a4f0ab1c2d3e4f5a6b7c8
                    version: 1
                    version_id: 9a1c2e3f4b5d6a7c8e9f0a1b2c3d4e5f
                    is_current: true
                    event_id: 736644
                    match:
                      event_id: 736644
                      date: '2026-10-24'
                      declared_date: '2026-10-24'
                      league: liga_mx
                      league_name: Liga MX
                      country: México
                      home_team: Pumas UNAM
                      away_team: Necaxa
                      kickoff: '2026-10-25T02:00:00Z'
                      kickoff_source: provider
                      kickoff_verified: true
                    market: 1x2
                    period: full_time
                    selection: home
                    probability: 58.0
                    confidence: 4
                    rationale: Local con mejor forma y ventaja de localía.
                    sources:
                    - name: ESPN
                      url: https://site.api.espn.com/apis/site/v2/sports/soccer/mex.1/summary?event=736644
                      note: Forma reciente y estadísticas del partido.
                    analyst: ana.garcia
                    method_version: analista-v1
                    generated_at: '2026-10-24T16:30:00Z'
                    received_at: '2026-10-24T17:05:12.345678Z'
                    timing:
                      status: pre_match
                      received_before_kickoff: true
                    settlement_status: pendiente
                    created_at: '2026-10-24T17:05:12.345678Z'
                    updated_at: '2026-10-24T17:05:12.345678Z'
                - prediction_id: 6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e
                  version: 1
                  version_id: 1f2e3d4c5b6a79880716253443526170
                  idempotency_key: 2026-10-24-liga-mx-736644-total-goals-over-2.5
                  status: created
                  analyst: ana.garcia
                  probability: 61.0
                  received_before_kickoff: true
        '200':
          description: No hubo creaciones y al menos un reintento válido; puede incluir rechazos por elemento.
          content:
            application/json:
              example:
                received_at: '2026-10-24T17:12:00Z'
                total: 2
                created: 0
                replayed: 1
                rejected: 1
                items:
                - prediction_id: 3d0f6f3e5c1a4f0ab1c2d3e4f5a6b7c8
                  version: 1
                  version_id: 9a1c2e3f4b5d6a7c8e9f0a1b2c3d4e5f
                  idempotency_key: 2026-10-24-liga-mx-736644-1x2-home
                  status: replayed
                  analyst: ana.garcia
                  probability: 58.0
                  received_before_kickoff: true
                  record:
                    document_id: 671b2c3d4e5f60718293a4b5
                    prediction_id: 3d0f6f3e5c1a4f0ab1c2d3e4f5a6b7c8
                    version: 1
                    version_id: 9a1c2e3f4b5d6a7c8e9f0a1b2c3d4e5f
                    is_current: true
                    event_id: 736644
                    match:
                      event_id: 736644
                      date: '2026-10-24'
                      declared_date: '2026-10-24'
                      league: liga_mx
                      league_name: Liga MX
                      country: México
                      home_team: Pumas UNAM
                      away_team: Necaxa
                      kickoff: '2026-10-25T02:00:00Z'
                      kickoff_source: provider
                      kickoff_verified: true
                    market: 1x2
                    period: full_time
                    selection: home
                    probability: 58.0
                    confidence: 4
                    rationale: Local con mejor forma y ventaja de localía.
                    sources:
                    - name: ESPN
                      url: https://site.api.espn.com/apis/site/v2/sports/soccer/mex.1/summary?event=736644
                      note: Forma reciente y estadísticas del partido.
                    analyst: ana.garcia
                    method_version: analista-v1
                    generated_at: '2026-10-24T16:30:00Z'
                    received_at: '2026-10-24T17:05:12.345678Z'
                    timing:
                      status: pre_match
                      received_before_kickoff: true
                    settlement_status: pendiente
                    created_at: '2026-10-24T17:05:12.345678Z'
                    updated_at: '2026-10-24T17:05:12.345678Z'
                - prediction_id: 6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e
                  idempotency_key: 2026-10-24-liga-mx-736644-total-goals-over-2.5
                  status: rejected
                  error: idempotency_key ya existe con un cuerpo distinto.
                  analyst: ana.garcia
                  probability: 58.0
              schema:
                $ref: '#/components/schemas/FootballPredictionBatchResponse'
        '409':
          description: Ninguna selección se pudo aceptar.
          content:
            application/json:
              example:
                received_at: '2026-10-24T17:10:00Z'
                total: 1
                created: 0
                replayed: 0
                rejected: 1
                items:
                - prediction_id: 6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e
                  idempotency_key: 2026-10-24-liga-mx-736644-total-goals-over-2.5
                  status: rejected
                  error: idempotency_key ya existe con un cuerpo distinto.
                  analyst: ana.garcia
                  probability: 58.0
              schema:
                $ref: '#/components/schemas/FootballPredictionBatchResponse'
        '422':
          description: Cuerpo o parámetros inválidos.
          content:
            application/json:
              example:
                detail:
                - type: value_error
                  loc:
                  - body
                  - items
                  - 0
                  msg: Value error, line debe ser múltiplo de 0.25 para asian_handicap y de 0.5 para los
                    demás mercados.
                  input:
                    market: total_goals
                    line: 2.25
        '503':
          description: MongoDB o la fuente no están disponibles.
          content:
            application/json:
              example:
                detail: Persistencia deshabilitada.
    get:
      tags:
      - Football Predictions
      summary: Consulta el historial de selecciones
      description: Por defecto devuelve solo la versión vigente de cada selección. Usa include_versions=true
        para ver también las versiones anteriores. match_date se interpreta como jornada en Ciudad de
        México (UTC-6); received_date filtra por el día en que el servidor recibió el registro, también
        en CDMX.
      operationId: list_predictions_api_v1_football_predictions_get
      parameters:
      - name: match_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Match Date
      - name: match_date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Match Date From
      - name: match_date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Match Date To
      - name: received_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Received Date
      - name: league
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/FootballLeague'
          - type: 'null'
          title: League
      - name: event_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Event Id
      - name: analyst
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Analyst
      - name: market
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Market'
          - type: 'null'
          title: Market
      - name: settlement_status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SettlementStatus'
          - type: 'null'
          title: Settlement Status
      - name: period
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Period'
          - type: 'null'
          title: Period
      - name: timing
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/TimingStatus'
          - type: 'null'
          title: Timing
      - name: include_versions
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Versions
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Page Size
      responses:
        '200':
          description: Página de selecciones registradas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FootballPredictionListResponse'
              example:
                items:
                - document_id: 671b2c3d4e5f60718293a4b5
                  prediction_id: 3d0f6f3e5c1a4f0ab1c2d3e4f5a6b7c8
                  version: 1
                  version_id: 9a1c2e3f4b5d6a7c8e9f0a1b2c3d4e5f
                  is_current: true
                  event_id: 736644
                  match:
                    event_id: 736644
                    date: '2026-10-24'
                    declared_date: '2026-10-24'
                    league: liga_mx
                    league_name: Liga MX
                    country: México
                    home_team: Pumas UNAM
                    away_team: Necaxa
                    kickoff: '2026-10-25T02:00:00Z'
                    kickoff_source: provider
                    kickoff_verified: true
                  market: 1x2
                  period: full_time
                  selection: home
                  probability: 58.0
                  confidence: 4
                  rationale: Local con mejor forma y ventaja de localía.
                  sources:
                  - name: ESPN
                    url: https://site.api.espn.com/apis/site/v2/sports/soccer/mex.1/summary?event=736644
                    note: Forma reciente y estadísticas del partido.
                  analyst: ana.garcia
                  method_version: analista-v1
                  generated_at: '2026-10-24T16:30:00Z'
                  received_at: '2026-10-24T17:05:12.345678Z'
                  timing:
                    status: pre_match
                    received_before_kickoff: true
                  settlement_status: pendiente
                  created_at: '2026-10-24T17:05:12.345678Z'
                  updated_at: '2026-10-24T17:05:12.345678Z'
                page: 1
                page_size: 50
                total: 1
        '422':
          description: Cuerpo o parámetros inválidos.
          content:
            application/json:
              example:
                detail:
                - type: value_error
                  loc:
                  - body
                  - items
                  - 0
                  msg: Value error, line debe ser múltiplo de 0.25 para asian_handicap y de 0.5 para los
                    demás mercados.
                  input:
                    market: total_goals
                    line: 2.25
        '503':
          description: MongoDB o la fuente no están disponibles.
          content:
            application/json:
              example:
                detail: Persistencia deshabilitada.
