  /api/v1/football/predictions/{prediction_id}/evaluations:
    post:
      tags:
      - Football Predictions
      summary: Registra la evaluación posterior del analista
      description: La evaluación se guarda en una colección aparte y queda ligada al prediction_id, versión
        y version_id. No modifica la selección, probabilidad, confianza ni fecha originales. La liquidación
        oficial sigue siendo responsabilidad del servicio autorizado.
      operationId: create_evaluation_api_v1_football_predictions__prediction_id__evaluations_post
      parameters:
      - name: prediction_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{7,63}$
          title: Prediction Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FootballPredictionEvaluationCreate'
      responses:
        '201':
          description: Evaluación posterior registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredEvaluation'
              example:
                evaluation_id: 671c3d4e5f60718293a4b5c6
