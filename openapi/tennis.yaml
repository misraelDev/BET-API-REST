openapi: 3.1.0
info:
  title: BET Analytics API - Tenis
  description: Contrato OpenAPI de tenis (ATP/WTA). Incluye solo las rutas `/api/v1/tennis` y los esquemas
    que esas rutas referencian. El resto de deportes está en archivos separados dentro de `openapi/`.
  version: 1.7.0
  contact:
    name: BET Analytics
  license:
    name: Privado
paths:
  /api/v1/tennis/matches/count:
    get:
      tags:
      - Tennis
      summary: Match Count
      operationId: match_count_api_v1_tennis_matches_count_get
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Date
      - name: timezone
        in: query
        required: false
        schema:
          type: string
          default: America/Mexico_City
          title: Timezone
      - name: tour
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TennisTour'
          default: all
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TennisMatchCountResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tennis/results:
    get:
      tags:
      - Tennis
      summary: Results
      operationId: results_api_v1_tennis_results_get
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date
      - name: tour
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TennisTour'
          default: all
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Page Size
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          deprecated: true
          title: Limit
        deprecated: true
      - name: hour
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 23
            minimum: 0
          - type: 'null'
          title: Hour
      - name: market
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Market
      - name: min_probability
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 100
            minimum: 0
          - type: 'null'
          title: Min Probability
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoredTennisPrediction'
                title: Response Results Api V1 Tennis Results Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tennis/results/update:
    post:
      tags:
      - Tennis
      summary: Update Results
      operationId: update_results_api_v1_tennis_results_update_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TennisResultsUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TennisResultsUpdateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    StoredTennisPrediction:
      properties:
        document_id:
          type: string
          title: Document Id
        sport:
          type: string
          title: Sport
        event_id:
          type: integer
          title: Event Id
        requested_date:
          type: string
          title: Requested Date
        model_version:
          type: string
          title: Model Version
        provider:
          type: string
          title: Provider
        timezone:
          type: string
          title: Timezone
        prediction:
          additionalProperties: true
          type: object
          title: Prediction
        generated_at:
          type: string
          format: date-time
          title: Generated At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        created_at:
          type: string
          format: date-time
          title: Created At
        settlement:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Settlement
      type: object
      required:
      - document_id
      - sport
      - event_id
      - requested_date
      - model_version
      - provider
      - timezone
      - prediction
      - generated_at
      - updated_at
      - created_at
      title: StoredTennisPrediction
    TennisMatchCountResponse:
      properties:
        date:
          type: string
          format: date
          title: Date
        tour:
          type: string
          title: Tour
        matches_found:
          type: integer
          title: Matches Found
      type: object
      required:
      - date
      - tour
      - matches_found
      title: TennisMatchCountResponse
    TennisResultsUpdateRequest:
      properties:
        date:
          type: string
          format: date
          title: Date
        tour:
          $ref: '#/components/schemas/TennisTour'
          default: all
      type: object
      required:
      - date
      title: TennisResultsUpdateRequest
    TennisResultsUpdateResponse:
      properties:
        date:
          type: string
          format: date
          title: Date
        tour:
          type: string
          title: Tour
        official_matches:
          type: integer
          title: Official Matches
        final_matches:
          type: integer
          title: Final Matches
        predictions_matched:
          type: integer
          title: Predictions Matched
        predictions_updated:
          type: integer
          title: Predictions Updated
      type: object
      required:
      - date
      - tour
      - official_matches
      - final_matches
      - predictions_matched
      - predictions_updated
      title: TennisResultsUpdateResponse
    TennisTour:
      type: string
      enum:
      - all
      - atp
      - wta
      title: TennisTour
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
servers:
- url: http://127.0.0.1:8000
  description: Desarrollo local (uvicorn)
- url: http://localhost:8000
  description: Alias de loopback
tags:
- name: Tennis
  description: Conteo de partidos, resultados y liquidación de tenis (ATP/WTA).
