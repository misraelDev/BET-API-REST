openapi: 3.1.0
info:
  title: BET Analytics API - Béisbol
  description: Contrato OpenAPI de béisbol (MLB/KBO). Incluye solo las rutas `/api/v1/baseball` y los
    esquemas que esas rutas referencian. El resto de deportes está en archivos separados dentro de `openapi/`.
  version: 1.6.0
  contact:
    name: BET Analytics
  license:
    name: Privado
paths:
  /api/v1/baseball/stats:
    get:
      tags:
      - Baseball
      summary: Baseball Stats
      operationId: baseball_stats_api_v1_baseball_stats_get
      parameters:
      - name: league
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BaseballLeague'
          default: all
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Baseball Stats Api V1 Baseball Stats Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/baseball/official-results:
    get:
      tags:
      - Baseball
      summary: Official Results
      operationId: official_results_api_v1_baseball_official_results_get
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Date
      - name: league
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BaseballLeague'
          default: mlb
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfficialBaseballGame'
                title: Response Official Results Api V1 Baseball Official Results Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/baseball/results/update:
    post:
      tags:
      - Baseball
      summary: Update Market Results
      operationId: update_market_results_api_v1_baseball_results_update_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseballResultsUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseballResultsUpdateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/baseball/results:
    get:
      tags:
      - Baseball
      summary: Stored Results
      operationId: stored_results_api_v1_baseball_results_get
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date
      - name: league
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BaseballLeague'
          default: all
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Page Size
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          deprecated: true
          title: Limit
        deprecated: true
      - name: hour
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 23
            minimum: 0
          - type: 'null'
          title: Hour
      - name: market
        in: query
        required: false
        schema:
          type: string
          default: winner
          title: Market
      - name: min_probability
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 100
            minimum: 0
          - type: 'null'
          title: Min Probability
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoredBaseballPrediction'
                title: Response Stored Results Api V1 Baseball Results Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/baseball/results/settle:
    post:
      tags:
      - Baseball
      summary: Settle Results
      operationId: settle_results_api_v1_baseball_results_settle_post
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Date
      - name: timezone
        in: query
        required: false
        schema:
          type: string
          default: America/Mexico_City
          title: Timezone
      - name: league
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BaseballLeague'
          default: all
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                title: Response Settle Results Api V1 Baseball Results Settle Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BaseballLeague:
      type: string
      enum:
      - all
      - mlb
      - kbo
      title: BaseballLeague
    BaseballResultsUpdateRequest:
      properties:
        date:
          type: string
          format: date
          title: Date
        league:
          $ref: '#/components/schemas/BaseballLeague'
      type: object
      required:
      - date
      - league
      title: BaseballResultsUpdateRequest
    BaseballResultsUpdateResponse:
      properties:
        date:
          type: string
          format: date
          title: Date
        league:
          type: string
          title: League
        official_games:
          type: integer
          title: Official Games
        final_games:
          type: integer
          title: Final Games
        predictions_matched:
          type: integer
          title: Predictions Matched
        predictions_updated:
          type: integer
          title: Predictions Updated
        not_found:
          items:
            type: string
          type: array
          title: Not Found
      type: object
      required:
      - date
      - league
      - official_games
      - final_games
      - predictions_matched
      - predictions_updated
      title: BaseballResultsUpdateResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    OfficialBaseballGame:
      properties:
        official_id:
          type: integer
          title: Official Id
        league:
          type: string
          title: League
        game_date:
          type: string
          format: date-time
          title: Game Date
        status:
          type: string
          title: Status
        detailed_status:
          type: string
          title: Detailed Status
        home_team:
          type: string
          title: Home Team
        away_team:
          type: string
          title: Away Team
        home_score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Home Score
        away_score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Away Score
        is_final:
          type: boolean
          title: Is Final
      type: object
      required:
      - official_id
      - league
      - game_date
      - status
      - detailed_status
      - home_team
      - away_team
      - is_final
      title: OfficialBaseballGame
    StoredBaseballPrediction:
      properties:
        document_id:
          type: string
          title: Document Id
        sport:
          type: string
          title: Sport
        event_id:
          type: integer
          title: Event Id
        requested_date:
          type: string
          title: Requested Date
        model_version:
          type: string
          title: Model Version
        provider:
          type: string
          title: Provider
        timezone:
          type: string
          title: Timezone
        prediction:
          additionalProperties: true
          type: object
          title: Prediction
        generated_at:
          type: string
          format: date-time
          title: Generated At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        created_at:
          type: string
          format: date-time
          title: Created At
        status:
          type: string
          title: Status
          default: pending
        settlement:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Settlement
      type: object
      required:
      - document_id
      - sport
      - event_id
      - requested_date
      - model_version
      - provider
      - timezone
      - prediction
      - generated_at
      - updated_at
      - created_at
      title: StoredBaseballPrediction
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
servers:
- url: http://127.0.0.1:8000
  description: Desarrollo local (uvicorn)
- url: http://localhost:8000
  description: Alias de loopback
tags:
- name: Baseball
  description: Estadísticas, resultados y liquidación de béisbol (MLB/KBO).
